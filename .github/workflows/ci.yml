# Gitter CI（M3.2 harness-mainline-roadmap.md）：双端构建 + 无头 smoke 回归。
# 说明：
# - app 端用 npx tsc 直跑（跳过 npm postbuild 的 electron-rebuild——CI 无需 node-pty 原生重编）；
# - web 端 build-pages 重新生成内置页包，保证包与源码一致；
# - smoke 全套在 windows-latest 上运行（node-pty ConPTY 相关探针在 Linux 上语义不同）；
# - 已知存量问题（2026-10-12）：smoke-seams-f 在本机与 CI 均可能崩（ext 循环注册时序，非 M 系列引入），
#   以 continue-on-error 容纳并单列观察，其余 smoke 硬门。
name: ci

on:
  push:
    branches: [master, dev]
  pull_request:

jobs:
  build-and-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build app (tsc)
        working-directory: app
        run: npx tsc -p tsconfig.json

      - name: Build web (vite + page packages)
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Smoke suite (headless)
        working-directory: app
        shell: pwsh
        run: |
          $failed = @()
          $smokes = Get-ChildItem dist/smoke-*.js | ForEach-Object { $_.Name }
          foreach ($s in $smokes) {
            Write-Host "=== $s ==="
            if ($s -eq "smoke-seams-f.js") {
              # 存量：外部循环注册时序崩溃（见 docs/known-issues.md），容纳但显示
              node "dist/$s"; if ($LASTEXITCODE -ne 0) { Write-Host "::warning::$s failed (known issue)" }
              continue
            }
            node "dist/$s"
            if ($LASTEXITCODE -ne 0) { $failed += $s }
          }
          if ($failed.Count -gt 0) { Write-Host "FAILED: $($failed -join ', ')"; exit 1 }
