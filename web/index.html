<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws://localhost:5173; worker-src blob:"

         srcdoc 文档继承本 CSP，故需放行内联脚本与 blob worker；预览库无网络请求，connect-src 不动。 -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
