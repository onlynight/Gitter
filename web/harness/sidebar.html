<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>Sidebar 折叠动画检查</title>
<script>
  // 动态挂宿主构建产物 CSS（文件名带 hash，每次构建会变）
  (async () => {
    const res = await fetch("../dist/assets/");
    const html = await res.text();
    const m = html.match(/index-[\w-]+\.css/);
    if (m) {
      const l = document.createElement("link");
      l.rel = "stylesheet";
      l.href = "../dist/assets/" + m[0];
      document.head.appendChild(l);
    } else {
      document.title = "未找到 dist CSS——请先 npm run build";
    }
  })();
</script>
<style>
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; }
  #root { flex: 1; min-height: 0; }
  .content { background: var(--c-panel2, var(--c-panel)); display: flex; align-items: center; justify-content: center; color: var(--c-text3); }
  .ctrl { padding: 6px 10px; }
  .slow .main { transition-duration: 1500ms !important; }
</style>
</head>
<body>
<div id="root">
  <div class="main" id="main">
    <div class="sidebar">
      <div class="nav-top">
        <button class="nav-item" title="项目"><span class="nav-ico"><span class="glyph">&#xE8B7;</span></span><span class="nav-label">项目</span></button>
        <button class="nav-item" title="Log"><span class="nav-ico"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3h12v1.5H2V3zm0 4.25h8.5v1.5H2v-1.5zM2 11.5h12V13H2v-1.5z" fill="currentColor"/></svg></span><span class="nav-label">Log</span></button>
        <button class="nav-item" title="分支"><span class="nav-ico"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.1 3.9a2.3 2.3 0 0 0-3.25 3.25l-.1.1a2.3 2.3 0 0 1-3.25 0L5.4 6.2a2.3 2.3 0 1 0-1.06 1.06l1.1 1.05a3.8 3.8 0 0 0 2.31 1.09v1.2a2.3 2.3 0 1 0 1.5 0V9.4a3.8 3.8 0 0 0 2.31-1.09l.1-.1a2.3 2.3 0 1 0 1.44-4.31z" fill="currentColor"/></svg></span><span class="nav-label">分支</span></button>
        <button class="nav-item active" title="变更"><span class="nav-ico"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4.25 5 8l-3 3.75V4.25zM6 3h1.5v10H6V3zm3 0h5a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H9v-1.5h4.5v-7H9V3z" fill="currentColor"/></svg></span><span class="nav-label">变更</span></button>
        <button class="nav-item" title="终端"><span class="nav-ico"><span class="glyph">&#xE756;</span></span><span class="nav-label">终端</span></button>
        <button class="nav-item" title="任务"><span class="nav-ico"><span class="glyph">&#xE7C1;</span></span><span class="nav-label">任务</span></button>
        <div class="nav-sep"></div>
        <div style="display:flex;align-items:center">
          <div style="flex:1;min-width:0">
            <button class="nav-item" title="示例外部页（com.example.hello-page）"><span class="nav-ico"><span class="glyph">&#xE8A5;</span></span><span class="nav-label">示例外部页页面标题较长会被裁切</span></button>
          </div>
          <button class="tool-btn nav-ext-x" style="padding:0 4px;font-size:10" title="卸载此外部页面">✕</button>
        </div>
      </div>
      <button class="nav-item" title="设置"><span class="nav-ico"><span class="glyph">&#xE713;</span></span><span class="nav-label">设置</span></button>
    </div>
    <div class="content">内容区</div>
  </div>
</div>
<div class="ctrl">
  <button id="toggle" class="tool-btn">折叠 / 展开</button>
  <label style="margin-left:12px;color:var(--c-text2);font-size:12px"><input type="checkbox" id="slow" /> 慢速（1.5s）便于观察中间帧</label>
</div>
<script>
  const main = document.getElementById("main");
  const theme = new URLSearchParams(location.search).get("base") === "light" ? "light" : "dark";
  const P = {
    dark: { Base:"#14161B99",Panel:"#FFFFFF0A",Panel2:"#FFFFFF12",Hover:"#FFFFFF14",Selected:"#FFFFFF2B",Border:"#FFFFFF21",BorderStrong:"#FFFFFF40",Accent:"#EAEAEA",AccentHover:"#FFFFFF",AccentPressed:"#C9C9C9",AccentSoft:"#EAEAEA1F",OnAccent:"#14161B",Text:"#EAEAEA",Text2:"#A8B0BC",Text3:"#78828E",Link:"#6BABF5",Green:"#3FB950",Red:"#F0655A",Amber:"#E3B341",ChipBlueBg:"#25324480",ChipBlueFg:"#8DB8F5",ChipPurpleBg:"#2B244080",ChipPurpleFg:"#B9A3EC" },
    light: { Base:"#FFFFFF8C",Panel:"#F7F7F814",Panel2:"#EFEFF11F",Hover:"#EBEBEC40",Selected:"#E0E1E359",Border:"#E5E5E580",BorderStrong:"#D0D0D0B3",Accent:"#1B1B1B",AccentHover:"#000000",AccentPressed:"#3A3A3A",AccentSoft:"#1B1B1B14",OnAccent:"#FFFFFF",Text:"#1B1B1B",Text2:"#5C5C5C",Text3:"#8F8F8F",Link:"#0B6BCB",Green:"#1A7F37",Red:"#CF222E",Amber:"#BF8700",ChipBlueBg:"#DDF4FF66",ChipBlueFg:"#0B6BCB",ChipPurpleBg:"#FBEFFF66",ChipPurpleFg:"#8250DF" },
  };
  const VARS = { Base:"--c-base",Panel:"--c-panel",Panel2:"--c-panel2",Hover:"--c-hover",Selected:"--c-selected",Border:"--c-border",BorderStrong:"--c-border-strong",Accent:"--c-accent",AccentHover:"--c-accent-hover",AccentPressed:"--c-accent-pressed",AccentSoft:"--c-accent-soft",OnAccent:"--c-on-accent",Text:"--c-text",Text2:"--c-text2",Text3:"--c-text3",Link:"--c-link",Green:"--c-green",Red:"--c-red",Amber:"--c-amber",ChipBlueBg:"--c-chip-blue-bg",ChipBlueFg:"--c-chip-blue-fg",ChipPurpleBg:"--c-chip-purple-bg",ChipPurpleFg:"--c-chip-purple-fg" };
  for (const [k, v] of Object.entries(VARS)) document.documentElement.style.setProperty(v, P[theme][k]);
  document.documentElement.dataset.base = theme;
  document.documentElement.style.background = theme === "dark" ? "#14161B" : "#f2f2f3";
  document.getElementById("toggle").onclick = () => main.classList.toggle("collapsed");
  document.getElementById("slow").onchange = (e) => document.body.classList.toggle("slow", e.target.checked);
</script>
</body>
</html>
